name: check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["**.nix", "flake.lock", ".github/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/nix
      - run: nix flake check --no-build
